# Prometheus for the Alondra1 API (compose profile "monitoring"; docs/runbooks/monitoring.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Point this at your Alertmanager (or Grafana alerting) to receive notifications; without it, alerts are visible in the
# Prometheus UI (http://127.0.0.1:9091/alerts).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: alondra1-api
    static_configs:
      - targets: ["api:9090"]
