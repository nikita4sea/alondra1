name: windows

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", "packages/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["apps/windows/**", "packages/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Alondra1.slnx -c Release
      # Includes ContractSchemaTests, which keep packages/api-contract and packages/shared-models in step with the model.
      - run: dotnet test Alondra1.slnx -c Release --no-build
