openapi: 3.1.0
info:
  title: Alondra1 cloud API
  version: 1.0.0-milestone-d
  description: |
    Optional cloud for Alondra1 (docs/BACKEND_SPEC.md, docs/decisions/0001-opt-in-cloud.md). This file is the source
    of truth for the /v1 API. Implemented: health, email one-time-code authentication (Milestone B), spaces with roles
    and invitations, devices, and account deletion (Milestone C), tasks, lists, groups, completion history, settings, and
    export (Milestone D). The endpoints in `x-alondra1-planned` are specified in
    the backend spec §9 and will be added here as they are implemented.

    Spaces: a caller who is not an active member of a space gets `404 NOT_FOUND` for it, exactly as for an id that does
    not exist, so space ids cannot be probed. Roles: `owner` (rename, delete, invite, remove anyone, change roles,
    transfer ownership), `admin` (rename, invite admins or members, remove members), `member`. Everyone may leave; a
    space with other members always keeps at least one owner. A Personal space has only its owner.

    Errors are always `{"error": {"code", "message", "request_id"}}` with a stable `code`. Every response carries
    `X-Request-ID` and `Cache-Control: no-store`. Request bodies are JSON (`application/json`), at most 16 KiB, with
    unknown fields rejected.
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose (development only; production requires TLS)
tags:
  - name: health
  - name: auth
  - name: account
  - name: spaces
  - name: devices
  - name: tasks
  - name: settings
paths:
  /v1/health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is running.
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
  /v1/health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness (database reachable)
      security: []
      responses:
        "200":
          description: Ready to serve.
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/email/start:
    post:
      tags: [auth]
      operationId: authEmailStart
      summary: Email a 6-digit sign-in code
      description: |
        Always returns the same shape whether or not an account exists (no enumeration). A new code invalidates older
        unused codes for the address. Limits: one request per 60 s per address, 5 per hour per address, plus per-IP and
        global limits.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: A code was sent (or would have been, for any address).
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_in_seconds, resend_after_seconds]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_in_seconds: { type: integer, const: 600 }
                  resend_after_seconds: { type: integer, const: 60 }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: authEmailVerify
      summary: Verify the code; sign in, creating the account on first use
      description: |
        Codes are valid for 10 minutes, once, with at most 5 attempts per challenge. Signing in never joins a space.
        Every failure returns the same `INVALID_CODE`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code, challenge_id]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$" }
                challenge_id: { type: string, format: uuid }
                device:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string, maxLength: 100, description: Display name, e.g. "Maya's laptop". }
                    platform: { type: string, enum: [windows, android, ios, other] }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Tokens"
                  - type: object
                    required: [user]
                    properties:
                      user:
                        type: object
                        required: [id, email]
                        properties:
                          id: { type: string, format: uuid }
                          email: { type: string, format: email }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token
      description: |
        Returns new tokens and invalidates the presented refresh token. Presenting an already rotated token is treated
        as theft: every session of that sign-in is revoked and `REFRESH_REUSED` is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, pattern: "^a1r_[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: New tokens.
          content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: End this device's sign-in
      responses:
        "204": { description: Signed out on this device. }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: authLogoutAll
      summary: End every sign-in of the account on every device
      responses:
        "204": { description: Signed out everywhere. }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in account and its spaces
      responses:
        "200":
          description: Profile and the spaces the caller is an active member of. A new account has none.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, created_at, memberships]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  created_at: { type: string, format: date-time }
                  memberships: { type: array, items: { $ref: "#/components/schemas/Space" } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Delete the account
      description: |
        Spaces where the caller is the only member are deleted; other memberships end; every session and device is
        revoked; the email address is released for a new sign-up. Refused with `OWNERSHIP_TRANSFER_REQUIRED` (listing
        `tenant_ids`) while the caller is the only owner of a space that still has other members.
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/tenants:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: Spaces the caller belongs to
      responses:
        "200":
          description: Active memberships.
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants: { type: array, items: { $ref: "#/components/schemas/Space" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [spaces]
      operationId: createSpace
      summary: Create a Personal, Family, or Organization space
      description: The type is always chosen explicitly and never changes. The caller becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { type: string, enum: [personal, family, organization] }
                name: { type: string, maxLength: 100, description: Required for family and organization; a Personal space defaults to "My space". }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/tenants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [spaces]
      operationId: getSpace
      summary: One space, with the caller's role
      responses:
        "200":
          description: The space.
          content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [spaces]
      operationId: renameSpace
      summary: Rename (owner or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Renamed.
          content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: Delete the space (owner)
      description: Soft delete; memberships end and pending invitations are revoked. Retention follows docs/decisions/0003-retention.md.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tenants/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [spaces]
      operationId: listMembers
      summary: Active members (any member)
      responses:
        "200":
          description: Members, owners first.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tenants/{id}/members/{user_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [spaces]
      operationId: changeMemberRole
      summary: Change a member's role (owner); making someone owner transfers ownership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        "200":
          description: Updated member.
          content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [spaces]
      operationId: removeMember
      summary: Remove a member, or leave (user_id = caller)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/tenants/{id}/invites:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [spaces]
      operationId: listInvites
      summary: Pending invitations (owner or admin)
      responses:
        "200":
          description: Pending, unexpired invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites: { type: array, items: { $ref: "#/components/schemas/Invite" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [spaces]
      operationId: createInvite
      summary: Email an invitation (owner or admin; Family and Organization only)
      description: |
        The invitation token is sent only by email and never returned. It is valid for 7 days, once, and only for the
        signed-in account with the invited address. A new invitation replaces a pending one for the same address.
        Nobody can invite above their own role or as owner. At most 20 invitations per space per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [admin, member] }
      responses:
        "201":
          description: Invitation sent.
          content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/tenants/{id}/invites/{invite_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [spaces]
      operationId: revokeInvite
      summary: Revoke a pending invitation (owner or admin)
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^a1i_[A-Za-z0-9_-]{43}$" } }
    post:
      tags: [spaces]
      operationId: acceptInvite
      summary: Join a space with an invitation from email
      description: The signed-in account's email must equal the invited address (`INVITE_EMAIL_MISMATCH` otherwise).
      responses:
        "200":
          description: Joined.
          content: { application/json: { schema: { $ref: "#/components/schemas/Space" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: The caller's signed-in devices
      description: Devices are registered at sign-in (`device` in the verify request).
      responses:
        "200":
          description: Devices, most recently seen first.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      required: [id, name, platform, last_seen_at, current]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        platform: { type: string, enum: [windows, android, ios, other] }
                        last_seen_at: { type: string, format: date-time }
                        current: { type: boolean, description: True for the device making this request. }
        "401": { $ref: "#/components/responses/Error" }
  /v1/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Sign a device out for good
      responses:
        "204": { description: Revoked; all its sessions end. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/list-groups:
    parameters: [{ $ref: "#/components/parameters/TenantID" }]
    get:
      tags: [tasks]
      operationId: listGroups
      summary: The caller's list groups in this space
      parameters: [{ $ref: "#/components/parameters/After" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Live groups ordered by id; `next_after` when more may follow.
          content: { application/json: { schema: { type: object, required: [groups], properties: { groups: { type: array, items: { $ref: "#/components/schemas/GroupRecord" } }, next_after: { type: string } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [tasks]
      operationId: createGroup
      summary: Create a group with the client's id
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [group], properties: { group: { $ref: "schemas/todo-v1.schema.json#/$defs/ListGroup" } } } } } }
      responses:
        "201": { $ref: "#/components/responses/GroupRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/list-groups/{id}:
    parameters: [{ $ref: "#/components/parameters/TenantID" }, { $ref: "#/components/parameters/ResourceID" }]
    get:
      tags: [tasks]
      operationId: getGroup
      summary: One group
      responses:
        "200": { $ref: "#/components/responses/GroupRecord" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [tasks]
      operationId: patchGroup
      summary: Merge-patch a group
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/Patch" }
      responses:
        "200": { $ref: "#/components/responses/GroupRecord" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tasks]
      operationId: deleteGroup
      summary: Delete a group; its lists become ungrouped
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted (tombstone kept for sync). }
        default: { $ref: "#/components/responses/Error" }
  /v1/task-lists:
    parameters: [{ $ref: "#/components/parameters/TenantID" }]
    get:
      tags: [tasks]
      operationId: listLists
      summary: The caller's task lists in this space
      parameters: [{ $ref: "#/components/parameters/After" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Live lists ordered by id.
          content: { application/json: { schema: { type: object, required: [lists], properties: { lists: { type: array, items: { $ref: "#/components/schemas/ListRecord" } }, next_after: { type: string } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [tasks]
      operationId: createList
      summary: Create a list with the client's id (at most one default list)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [list], properties: { list: { $ref: "schemas/todo-v1.schema.json#/$defs/TaskList" } } } } } }
      responses:
        "201": { $ref: "#/components/responses/ListRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/task-lists/{id}:
    parameters: [{ $ref: "#/components/parameters/TenantID" }, { $ref: "#/components/parameters/ResourceID" }]
    get:
      tags: [tasks]
      operationId: getList
      summary: One list
      responses:
        "200": { $ref: "#/components/responses/ListRecord" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [tasks]
      operationId: patchList
      summary: Merge-patch a list (rename, reorder, regroup, recolor); isDefault cannot change
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/Patch" }
      responses:
        "200": { $ref: "#/components/responses/ListRecord" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tasks]
      operationId: deleteList
      summary: Delete a list and its tasks (not the default list)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted with its tasks (tombstones kept; completion history kept). }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks:
    parameters: [{ $ref: "#/components/parameters/TenantID" }]
    get:
      tags: [tasks]
      operationId: listTasks
      summary: The caller's tasks in this space (never other members' tasks)
      parameters:
        - { $ref: "#/components/parameters/After" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: list_id, in: query, schema: { type: string }, description: Only tasks of this list. }
      responses:
        "200":
          description: Live tasks ordered by id. Smart views (My Day, Planned, ...) are filters the client derives.
          content: { application/json: { schema: { type: object, required: [tasks], properties: { tasks: { type: array, items: { $ref: "#/components/schemas/TaskRecord" } }, next_after: { type: string } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a full TodoTask with the client's id
      description: |
        The body is the 1.3.0 task as structured data (natural-language quick add stays on the client). Reminder delivery
        state (`deliveredFor`, `dismissed`, `snoozedUntilUtc`) is accepted but not stored: it belongs to each device.
        An existing id, live or deleted, returns `409 ALREADY_EXISTS` with the server copy, so a retried create is
        recognizable and a deleted task is never resurrected by accident.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [task], properties: { task: { $ref: "schemas/todo-v1.schema.json#/$defs/TodoTask" } } } } } }
      responses:
        "201": { $ref: "#/components/responses/TaskRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks/completion-history:
    parameters: [{ $ref: "#/components/parameters/TenantID" }]
    get:
      tags: [tasks]
      operationId: completionHistory
      summary: The caller's completion history, newest first
      parameters:
        - { name: before, in: query, schema: { type: string }, description: Opaque cursor from `next_before`. }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Append-only records, including every occurrence of recurring tasks.
          content: { application/json: { schema: { type: object, required: [history], properties: { history: { type: array, items: { $ref: "schemas/todo-v1.schema.json#/$defs/CompletionRecord" } }, next_before: { type: string } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/TenantID" }, { $ref: "#/components/parameters/ResourceID" }]
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task
      responses:
        "200": { $ref: "#/components/responses/TaskRecord" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [tasks]
      operationId: patchTask
      summary: Merge-patch a task, optionally appending a completion record atomically
      description: |
        `changes` is an RFC 7386 merge patch of the TodoTask (`null` removes a field); the result is validated as a
        whole. `append_completion` adds one CompletionRecord (taskId = this task) in the same transaction, e.g.
        completing one occurrence of a repeating task while advancing its due date. Retrying with the same record id
        is harmless; a different record under the same id is `409 COMPLETION_CONFLICT`.
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                changes: { type: object }
                append_completion: { $ref: "schemas/todo-v1.schema.json#/$defs/CompletionRecord" }
      responses:
        "200": { $ref: "#/components/responses/TaskRecord" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task (tombstone kept for sync; completion history kept)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /v1/config/user/{namespace}:
    parameters: [{ $ref: "#/components/parameters/TenantID" }, { $ref: "#/components/parameters/UserNamespace" }]
    get:
      tags: [settings]
      operationId: getUserSettings
      summary: The caller's private settings in this space
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putUserSettings
      summary: Replace (If-Match "0" for a namespace never written)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/SettingsData" }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [settings]
      operationId: patchUserSettings
      summary: Merge-patch
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/SettingsChanges" }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
  /v1/config/tenant/{namespace}:
    parameters: [{ $ref: "#/components/parameters/TenantID" }, { $ref: "#/components/parameters/SpaceNamespace" }]
    get:
      tags: [settings]
      operationId: getSpaceSettings
      summary: Space settings (any member)
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putSpaceSettings
      summary: Replace (owner or admin)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/SettingsData" }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [settings]
      operationId: patchSpaceSettings
      summary: Merge-patch (owner or admin)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { $ref: "#/components/requestBodies/SettingsChanges" }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        default: { $ref: "#/components/responses/Error" }
  /v1/data/export:
    get:
      tags: [account]
      operationId: exportData
      summary: Export the account's data (synchronous; small accounts)
      description: |
        Profile, spaces, and for each space the caller's own tasks as an `alondra1-todo` document (importable by the
        Windows app) plus personal settings. Never other members' data. Attachment files are not in the cloud.
      responses:
        "200":
          description: The export.
          content: { application/json: { schema: { type: object, required: [format, version, account, spaces] } } }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
components:
  parameters:
    TenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: The space. Membership is verified inside every request's transaction; non-members get `404 TENANT_NOT_FOUND`.
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
      description: The client's id (preserved on cloud enrollment).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, example: '"3"' }
      description: The version last read (ETag). Missing → `428 PRECONDITION_REQUIRED`; stale → `409 VERSION_CONFLICT` with the server copy in `error.current`. Nothing is overwritten silently.
    After:
      name: after
      in: query
      schema: { type: string }
      description: Return ids greater than this (use `next_after`).
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
    UserNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, enum: [appearance, todo.preferences] }
      description: |
        `appearance`: `theme` (System, Light, Dark), `lightColors` / `darkColors` (…Brush → #RRGGBB). Background
        pictures are local files and not synced. `todo.preferences`: `sortByView`, `sortDescendingByView`,
        `statusFilter`, `importantOnlyFilter`, `showCounts`, `calendarMode`, `notificationsEnabled`, `snoozeMinutes`
        (selected view and details pane stay on the device). Unknown keys are rejected.
    SpaceNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, enum: [space.profile] }
      description: "`space.profile`: `accentColor` (#RRGGBB), `description` (≤ 500 characters)."
  requestBodies:
    Patch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [changes]
            properties:
              changes: { type: object, description: RFC 7386 merge patch of the todo-v1 object; the result is validated as a whole. }
    SettingsData:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: object } } } } }
    SettingsChanges:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [changes], properties: { changes: { type: object } } } } }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token from verify or refresh; valid 15 minutes.
  schemas:
    Space:
      type: object
      required: [id, type, name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [personal, family, organization] }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member], description: The caller's role. }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member] }
        joined_at: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    GroupRecord:
      type: object
      required: [id, version, schema_version, updated_at, group]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer, const: 1 }
        updated_at: { type: string, format: date-time }
        group: { $ref: "schemas/todo-v1.schema.json#/$defs/ListGroup" }
    ListRecord:
      type: object
      required: [id, version, schema_version, updated_at, list]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer, const: 1 }
        updated_at: { type: string, format: date-time }
        list: { $ref: "schemas/todo-v1.schema.json#/$defs/TaskList" }
    TaskRecord:
      type: object
      required: [id, version, schema_version, updated_at, task]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer, const: 1 }
        updated_at: { type: string, format: date-time }
        task: { $ref: "schemas/todo-v1.schema.json#/$defs/TodoTask" }
    SettingsDoc:
      type: object
      required: [namespace, version, data]
      properties:
        namespace: { type: string }
        version: { type: integer, minimum: 0, description: 0 when never written (data is {}). }
        updated_at: { type: string, format: date-time }
        data: { type: object }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
    Tokens:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, session]
      properties:
        token_type: { const: Bearer }
        access_token: { type: string, description: Short-lived (15 min). Keep in memory. }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: Opaque, rotating, 30 days. Store only in the OS credential store (Windows DPAPI / Credential Manager, Android Keystore, iOS Keychain), never in config files or exports.
        refresh_token_expires_at: { type: string, format: date-time }
        session:
          type: object
          required: [id, device_id]
          properties:
            id: { type: string, format: uuid }
            device_id: { type: string, format: uuid }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum: [NOT_FOUND, METHOD_NOT_ALLOWED, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, BODY_TOO_LARGE, INVALID_EMAIL,
                     RATE_LIMITED, EMAIL_DELIVERY_FAILED, INVALID_CODE, REFRESH_INVALID, REFRESH_REUSED, UNAUTHENTICATED,
                     FORBIDDEN, LAST_OWNER, PERSONAL_SPACE, ALREADY_MEMBER, INVITE_INVALID, INVITE_EMAIL_MISMATCH,
                     INVALID_NAME, INVALID_TYPE, INVALID_ROLE, OWNERSHIP_TRANSFER_REQUIRED, TENANT_REQUIRED, TENANT_NOT_FOUND,
                     VALIDATION_FAILED, INVALID_REFERENCE, PRECONDITION_REQUIRED, VERSION_CONFLICT, ALREADY_EXISTS,
                     COMPLETION_CONFLICT, DEFAULT_LIST, DEFAULT_LIST_EXISTS, IMMUTABLE_FIELD, INVALID_CURSOR,
                     UNKNOWN_NAMESPACE, EXPORT_TOO_LARGE, NOT_READY, INTERNAL]
            message: { type: string }
            request_id: { type: string }
            tenant_ids:
              type: array
              items: { type: string, format: uuid }
              description: Only with OWNERSHIP_TRANSFER_REQUIRED.
            problems:
              type: array
              items: { type: string }
              description: Only with VALIDATION_FAILED.
            current:
              type: object
              description: With VERSION_CONFLICT and ALREADY_EXISTS, the server's record (same shape as a GET), for the client's conflict queue.
            current_deleted: { type: boolean }
  responses:
    GroupRecord:
      description: A group with its version (also in ETag).
      content: { application/json: { schema: { $ref: "#/components/schemas/GroupRecord" } } }
    ListRecord:
      description: A list with its version (also in ETag).
      content: { application/json: { schema: { $ref: "#/components/schemas/ListRecord" } } }
    TaskRecord:
      description: A task with its version (also in ETag).
      content: { application/json: { schema: { $ref: "#/components/schemas/TaskRecord" } } }
    Settings:
      description: A settings document with its version (also in ETag).
      content: { application/json: { schema: { $ref: "#/components/schemas/SettingsDoc" } } }
    Error:
      description: Error with a stable code.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait. }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
security:
  - bearer: []
x-alondra1-planned:
  # POST /v1/devices (spec §9) becomes the sync-device registration with cursors in Milestone E; until then devices
  # are registered at sign-in.
  milestone-e-devices: [POST /v1/devices]
  milestone-e: [GET /v1/sync/bootstrap, GET /v1/sync/changes, POST /v1/sync/push]
