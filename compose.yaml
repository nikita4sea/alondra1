# Alondra1 cloud backend on Docker Compose (docs/BACKEND_SPEC.md §12).
#   docker compose up -d                                   API + PostgreSQL (development: API on 127.0.0.1 only)
#   docker compose --profile tls up -d                     + Caddy with automatic HTTPS (production entry point)
#   docker compose --profile backup up -d                  + encrypted daily backups with restore checks
#   docker compose --profile monitoring up -d              + Prometheus with alert rules
#   docker compose --profile dev-mail up -d mailpit        development SMTP sink
# Runbooks: docs/runbooks/compose.md (development), production.md, backup-restore.md, monitoring.md, release.md.
name: alondra1

services:
  api:
    # Built and published by the release workflow; production pins it by digest (alondra1-api@sha256:...).
    image: ${ALONDRA1_API_IMAGE:?Set ALONDRA1_API_IMAGE in .env to a built backend image}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALONDRA1_HTTP_ADDR: ":8080"
      ALONDRA1_METRICS_ADDR: ":9090"  # internal network only; never published
      ALONDRA1_DB_HOST: db
      ALONDRA1_DB_PORT: "5432"
      ALONDRA1_DB_NAME: ${ALONDRA1_DB_NAME:-alondra1}
      ALONDRA1_DB_USER: ${ALONDRA1_DB_USER:-alondra1}
      ALONDRA1_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ALONDRA1_DB_SSLMODE: disable  # internal Compose network only
      ALONDRA1_TOKEN_KEY_FILE: /run/secrets/token_key
      ALONDRA1_TOKEN_KEY_PREVIOUS_FILE: /run/secrets/token_key_previous  # empty unless rotating keys
      ALONDRA1_OTP_KEY_FILE: /run/secrets/otp_key
      ALONDRA1_MAIL_FROM: ${ALONDRA1_MAIL_FROM:-Alondra1 <no-reply@example.invalid>}
      ALONDRA1_SMTP_HOST: ${ALONDRA1_SMTP_HOST:-}
      ALONDRA1_SMTP_PORT: ${ALONDRA1_SMTP_PORT:-587}
      ALONDRA1_SMTP_TLS_MODE: ${ALONDRA1_SMTP_TLS_MODE:-starttls}
      ALONDRA1_SMTP_USERNAME: ${ALONDRA1_SMTP_USERNAME:-}
      ALONDRA1_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      ALONDRA1_TRUST_PROXY_HEADERS: ${ALONDRA1_TRUST_PROXY_HEADERS:-false}
      ALONDRA1_MAINTENANCE_INTERVAL: ${ALONDRA1_MAINTENANCE_INTERVAL:-6h}
      ALONDRA1_BACKUP_STATUS_FILE: /backup-status/status.json
    secrets:
      - postgres_password
      - token_key
      - token_key_previous
      - otp_key
      - smtp_password
    volumes:
      - backups:/backup-status:ro  # read-only: the API only reports backup freshness in /metrics
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      # Localhost only. Public traffic goes through the "tls" profile (Caddy); never publish this port publicly.
      - "127.0.0.1:${ALONDRA1_API_PORT:-8080}:8080"
    networks: [internal]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALONDRA1_DB_NAME:-alondra1}
      POSTGRES_USER: ${ALONDRA1_DB_USER:-alondra1}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No `ports:`: the database is reachable only on the internal Compose network.
    networks: [internal]

  caddy:
    image: caddy:2.8
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ALONDRA1_DOMAIN: ${ALONDRA1_DOMAIN:?Set ALONDRA1_DOMAIN in .env for the tls profile}
      ALONDRA1_ACME_EMAIL: ${ALONDRA1_ACME_EMAIL:?Set ALONDRA1_ACME_EMAIL in .env for the tls profile}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: ${ALONDRA1_BACKUP_IMAGE:-alondra1-backup:dev}
    build: deploy/backup
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${ALONDRA1_DB_NAME:-alondra1}
      PGUSER: ${ALONDRA1_DB_USER:-alondra1}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      AGE_RECIPIENTS_FILE: /run/secrets/backup_recipients
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${ALONDRA1_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${ALONDRA1_BACKUP_RETENTION_DAYS:-35}
    secrets:
      - postgres_password
      - backup_recipients
    volumes:
      - backups:/backups
    networks: [internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"  # UI on localhost only
    networks: [internal]

  mailpit:
    # Development-only SMTP sink (profile dev-mail). Never point real users at it.
    # For local testing set ALONDRA1_SMTP_HOST=mailpit, ALONDRA1_SMTP_PORT=1025, ALONDRA1_SMTP_TLS_MODE=none.
    image: axllent/mailpit:v1.21
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # web UI, localhost only
    networks: [internal]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  token_key:
    file: ./secrets/token_key
  token_key_previous:
    file: ./secrets/token_key_previous
  otp_key:
    file: ./secrets/otp_key
  smtp_password:
    file: ./secrets/smtp_password
  backup_recipients:
    file: ./secrets/backup_recipients  # age PUBLIC key(s); the private key stays offline

volumes:
  postgres_data:
  backups:  # encrypted dumps; copy them off the host (docs/runbooks/backup-restore.md)
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  internal: {}
