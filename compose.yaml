# Alondra1 cloud backend: local Docker Compose runtime (docs/BACKEND_SPEC.md §12, docs/runbooks/compose.md).
# Development scope only: no TLS, no backups. Put a TLS-terminating reverse proxy in front before any non-local use;
# plain HTTP exposed to the internet is forbidden.
name: alondra1

services:
  api:
    # Built separately (backend/Dockerfile) and selected in .env; Compose does not build it.
    image: ${ALONDRA1_API_IMAGE:?Set ALONDRA1_API_IMAGE in .env to a built backend image}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALONDRA1_HTTP_ADDR: ":8080"
      ALONDRA1_DB_HOST: db
      ALONDRA1_DB_PORT: "5432"
      ALONDRA1_DB_NAME: ${ALONDRA1_DB_NAME:-alondra1}
      ALONDRA1_DB_USER: ${ALONDRA1_DB_USER:-alondra1}
      ALONDRA1_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ALONDRA1_DB_SSLMODE: disable  # internal Compose network only
      ALONDRA1_TOKEN_KEY_FILE: /run/secrets/token_key
      ALONDRA1_OTP_KEY_FILE: /run/secrets/otp_key
      ALONDRA1_MAIL_FROM: ${ALONDRA1_MAIL_FROM:-Alondra1 <no-reply@example.invalid>}
      ALONDRA1_SMTP_HOST: ${ALONDRA1_SMTP_HOST:-}
      ALONDRA1_SMTP_PORT: ${ALONDRA1_SMTP_PORT:-587}
      ALONDRA1_SMTP_TLS_MODE: ${ALONDRA1_SMTP_TLS_MODE:-starttls}
      ALONDRA1_SMTP_USERNAME: ${ALONDRA1_SMTP_USERNAME:-}
      ALONDRA1_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      ALONDRA1_TRUST_PROXY_HEADERS: ${ALONDRA1_TRUST_PROXY_HEADERS:-false}
    secrets:
      - postgres_password
      - token_key
      - otp_key
      - smtp_password
    ports:
      # Localhost only. Never publish this port publicly without TLS in front.
      - "127.0.0.1:${ALONDRA1_API_PORT:-8080}:8080"
    networks: [internal]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALONDRA1_DB_NAME:-alondra1}
      POSTGRES_USER: ${ALONDRA1_DB_USER:-alondra1}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No `ports:`: the database is reachable only on the internal Compose network.
    networks: [internal]

  mailpit:
    # Development-only SMTP sink (profile dev-mail). Never point real users at it.
    # For local testing set ALONDRA1_SMTP_HOST=mailpit, ALONDRA1_SMTP_PORT=1025, ALONDRA1_SMTP_TLS_MODE=none.
    image: axllent/mailpit:v1.21
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # web UI, localhost only
    networks: [internal]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  token_key:
    file: ./secrets/token_key
  otp_key:
    file: ./secrets/otp_key
  smtp_password:
    file: ./secrets/smtp_password

volumes:
  postgres_data:

networks:
  internal: {}
